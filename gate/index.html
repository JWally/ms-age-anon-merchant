<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#faf7f2" />
    <title>Come on in · HornPub</title>
    <link rel="stylesheet" href="/gate.css" />
    <script
      defer
      src="https://captcha.wolcott.cc/assets/fortress-captcha.js"
    ></script>
    <script defer src="/gate.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Horn<span>Pub</span></a
      ><span class="eyebrow">GOOD FOOD. QUESTIONABLE PUNS.</span>
    </header>
    <main class="card">
      <div class="door" aria-hidden="true">
        H<span>OPEN AFTER A QUICK CHECK</span>
      </div>
      <p class="eyebrow">A LITTLE CHECK AT THE DOOR</p>
      <h1>Come on in.</h1>
      <p class="lead">
        Before the food, the music, and the terrible jokes—let’s make sure
        there’s a human behind this visit.
      </p>
      <form id="entry">
        <button class="button" type="submit">
          Verify and enter <span aria-hidden="true">↗</span>
        </button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="quiet">Protected by Fortress</p>
      <noscript
        ><p>Please enable JavaScript to complete the check.</p></noscript
      >
    </main>
    <footer>HornPub · A Fortress demo</footer>
  </body>
</html>
